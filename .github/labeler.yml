# Labels for pull requests based on file paths

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

agents:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/resume_screener/agents/**'

models:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/resume_screener/models/**'

api:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/resume_screener/main.py'
          - 'src/resume_screener/services/**'

ui:
  - changed-files:
      - any-glob-to-any-file:
          - 'ui/**'

prompts:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/resume_screener/prompts.py'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pyproject.toml'
          - 'uv.lock'
